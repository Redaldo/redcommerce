services:
  # === Backend (Laravel) =============================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend
    restart: unless-stopped
    volumes:
      - ./backend:/var/www
    user: "${UID:-1000}:${GID:-1000}"
    env_file:
      - ./backend/.env
    depends_on:
      - mysql

  # === Frontend (Nuxt 3) ===============================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend
    restart: unless-stopped
    volumes:
      - ./frontend:/app
    env_file:
      - ./frontend/.env

  # === MySQL ===========================================
  mysql:
    image: mysql:8.0
    container_name: mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: laravel
      MYSQL_USER: laravel
      MYSQL_PASSWORD: secret
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"

  # === Nginx Reverse Proxy =============================
  nginx:
    image: nginx:stable-alpine
    container_name: nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./backend/public:/var/www/public
      - ./frontend/.output/public:/usr/share/nginx/html
    depends_on:
      - backend
      - frontend

volumes:
  mysql_data:
